<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word Search Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="openSettings">Open Settings</button>

    <div id="setup-panel">
        <textarea id="wordInput" placeholder="Enter words separated by comma"></textarea>
        <button id="generateBtn">Generate Game</button>
    </div>

    <div id="game-container">
        <div id="grid"></div>
        <div id="word-list">
            <h3>Words to Find</h3>
            <ul id="list"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
